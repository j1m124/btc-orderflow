# The workspace is mixed: btc_orderflow targets wasm32-unknown-unknown,
# btc_orderflow_server targets the host. We do NOT set a global default
# target — bare `cargo` commands fail without `--target` or a `-p` that
# points at a single-target crate. The Makefile drives the per-crate
# orchestration; see `make check`.

[target.wasm32-unknown-unknown]
rustflags = []
# `cargo test -p btc_orderflow --target wasm32-unknown-unknown` compiles
# the test binary to wasm; this runner executes the resulting .wasm in Node
# via wasm-bindgen's test harness. Shipped by the `wasm-bindgen-cli`
# install — make sure its version matches the wasm-bindgen crate in
# Cargo.lock (currently 0.2.120; same pin as the Makefile and CI).
runner = "wasm-bindgen-test-runner"
