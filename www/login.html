<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · centoflow</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        width: 100vw; height: 100vh; display: grid; place-items: center;
        background: #0d0d10; color: #d4d4d4;
      }
      form {
        width: 320px; display: flex; flex-direction: column; gap: 12px;
        background: #15151b; border: 1px solid #23232b; border-radius: 12px; padding: 28px;
      }
      h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
      input {
        background: #0d0d10; border: 1px solid #2a2a33; border-radius: 8px;
        padding: 10px 12px; color: #eee; font-size: 14px;
      }
      input:focus { outline: none; border-color: #4f8cff; }
      button {
        border: none; border-radius: 8px; padding: 10px 12px; font-size: 14px;
        cursor: pointer; font-weight: 600;
      }
      .primary { background: #4f8cff; color: #fff; }
      .ghost { background: transparent; color: #9aa; border: 1px solid #2a2a33; }
      .err { color: #ff5555; font-size: 13px; min-height: 16px; }
      .msg { color: #4ec98f; font-size: 13px; min-height: 16px; }
      .sep { color: #555; font-size: 12px; text-align: center; }
      .link {
        background: none; border: none; color: #4f8cff; font-size: 13px;
        cursor: pointer; text-align: center; padding: 4px;
      }
    </style>
  </head>
  <body>
    <form id="login">
      <h1 id="title">Sign in</h1>
      <input id="email" type="email" placeholder="Email" autocomplete="email" required />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
      <div id="err" class="err"></div>
      <div id="msg" class="msg"></div>
      <button id="submit" class="primary" type="submit">Sign in</button>
      <button id="toggle" class="link" type="button">Need an account? Sign up</button>
      <div class="sep">or</div>
      <button id="google" class="ghost" type="button">Continue with Google</button>
    </form>

    <script type="module">
      import { supabase, syncToken, isConfigured } from './src/supabase.js';

      const err = (m) => { document.getElementById('err').textContent = m; };
      const msg = (m) => { document.getElementById('msg').textContent = m; };

      if (!isConfigured) {
        // No client to talk to — show why and stop (supabase is null).
        err('Supabase not configured: set VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY at build time, then rebuild.');
      } else {
        // --- sign-in / sign-up mode toggle ---
        let mode = 'signin';
        const title = document.getElementById('title');
        const submitBtn = document.getElementById('submit');
        const toggle = document.getElementById('toggle');
        const passwordEl = document.getElementById('password');

        function setMode(next) {
          mode = next;
          const signup = mode === 'signup';
          title.textContent = signup ? 'Create account' : 'Sign in';
          submitBtn.textContent = signup ? 'Sign up' : 'Sign in';
          toggle.textContent = signup ? 'Have an account? Sign in' : 'Need an account? Sign up';
          passwordEl.setAttribute('autocomplete', signup ? 'new-password' : 'current-password');
          err(''); msg('');
        }
        toggle.addEventListener('click', () => setMode(mode === 'signin' ? 'signup' : 'signin'));

        // Already signed in (or just returned from an OAuth / email-confirm
        // redirect)? Go in.
        const { data: { session } } = await supabase.auth.getSession();
        if (session) { syncToken(session); location.replace('/'); }

        document.getElementById('login').addEventListener('submit', async (e) => {
          e.preventDefault();
          err(''); msg('');
          const email = document.getElementById('email').value;
          const password = passwordEl.value;

          if (mode === 'signup') {
            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) { err(error.message); return; }
            if (data.session) {
              // Email confirmation disabled → signed in immediately.
              syncToken(data.session);
              location.replace('/');
            } else {
              // Confirmation required → no session until they click the link.
              msg('Account created. Check your email to confirm, then sign in.');
              setMode('signin');
            }
            return;
          }

          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) { err(error.message); return; }
          syncToken(data.session);
          location.replace('/');
        });

        document.getElementById('google').addEventListener('click', async () => {
          const { error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: location.origin + '/login.html' },
          });
          if (error) err(error.message);
        });
      }
    </script>
  </body>
</html>
