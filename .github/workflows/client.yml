name: deploy-client

# Push to main touching client/protocol/frontend inputs → build Dockerfile.client
# → push to GHCR (`btc-orderflow-client:latest` + `:<version>` + `:sha-<short>`)
# → ping the client's Dokploy redeploy webhook.
#
# `:<version>` is read from `crates/client/Cargo.toml` (the client owns the
# app's semver; server + protocol are SHA-only). When that version is new, the
# job also pushes a lightweight `client-v<version>` git tag at the built commit
# for an immutable rollback point — re-runs and version-unchanged pushes skip it.
#
# Split from the old combined `deploy.yml` so a server-only change never
# rebuilds the WASM blob (the long pole). The genuinely-shared inputs —
# `crates/protocol/**`, `vendor/**`, root `Cargo.toml`, `rust-toolchain.toml` —
# are in BOTH this and server.yml so a wire-protocol / shared-dep change
# redeploys both halves (deploy server first; see CLAUDE.md "Split deployment").
# `Cargo.lock` is deliberately NOT a trigger: it churns on per-crate version
# bumps (the client semver), which must not cross-trigger the other half.
#
# Required GHA secrets:
#   DOKPLOY_CLIENT_WEBHOOK_URL  (optional) — POSTed to on success to trigger a
#                               redeploy. Unset → no-op (rely on Dokploy polling).

on:
  push:
    branches: [main]
    paths:
      - 'crates/client/**'
      - 'crates/protocol/**'
      - 'www/**'
      - 'vendor/**'
      - 'fonts/**'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'Dockerfile.client'
      - '.github/workflows/client.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-client

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the client-v<version> release tag
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Single source of truth for the client semver: the [package] version in
      # crates/client/Cargo.toml. `^version` is anchored so it matches only the
      # package line, never a dependency's inline `version = ...`.
      - name: Read client version
        id: ver
        run: |
          v=$(grep -m1 -E '^version[[:space:]]*=' crates/client/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$v" ]; then echo "could not read client version from Cargo.toml" >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Client version: $v"

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }}
            type=sha,format=short

      # scope=client keeps this image's wasm cook layer in its own GHA cache
      # namespace so it doesn't evict the server image's native cook layer (see
      # the matching note in server.yml).
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.client
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_REF=${{ github.ref_name }}

      # Record an immutable release point for this version. Idempotent: queries
      # the remote directly (checkout fetches no tags), so re-runs and pushes
      # that didn't bump the version are no-ops. A lightweight tag needs no
      # git user identity; the push rides the checkout's GITHUB_TOKEN. Tag
      # pushes don't re-trigger this workflow (it only fires on branch pushes).
      - name: Tag release commit
        if: github.ref == 'refs/heads/main'
        env:
          TAG: client-v${{ steps.ver.outputs.version }}
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "$TAG already exists on remote; client version unchanged, skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed $TAG"
          fi

      - name: Trigger Dokploy redeploy
        env:
          DOKPLOY_CLIENT_WEBHOOK_URL: ${{ secrets.DOKPLOY_CLIENT_WEBHOOK_URL }}
        run: |
          if [ -n "$DOKPLOY_CLIENT_WEBHOOK_URL" ]; then
            echo "POST to Dokploy client webhook"
            curl -fsS -X POST "$DOKPLOY_CLIENT_WEBHOOK_URL"
          else
            echo "DOKPLOY_CLIENT_WEBHOOK_URL not set; skipping (Dokploy polling will pick up the new image)"
          fi
