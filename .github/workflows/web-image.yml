name: Build web image (Railway)

# Builds the WASM + Vite bundle on GitHub's runners (cached) and publishes a
# tiny static Caddy image to GHCR. Railway deploys that image, so it never has
# to run the heavy Rust/WASM build itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Respects rust-toolchain.toml (channel + components + targets).
      # Bumps live in that one file; CI follows without edits here.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false  # Swatinem/rust-cache below owns caching.

      # Caches cargo registry/git deps + target/ so repeat builds drop from
      # ~10–15 min to ~2–3 min.
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        run: cargo install --locked wasm-bindgen-cli@0.2.120

      # Gate the deploy on a green test run. Tests compile to wasm and
      # execute via wasm-bindgen-test-runner (installed by the wasm-bindgen-cli
      # install above). Node is preinstalled on the GH runner so no extra
      # step needed for the harness.
      #
      # `--release` so the test build shares cargo's release-profile dep
      # cache with the production WASM build below. Without it, debug and
      # release profiles each cold-compile the full dep tree separately,
      # ~doubling cold-cache wall time.
      - name: cargo test (wasm)
        run: cargo test --release

      - uses: oven-sh/setup-bun@v2

      - name: Build WASM (release)
        env:
          # Baked into the bundle via option_env! at compile time.
          CENTOFLOW_BASE_URL: ${{ vars.CENTOFLOW_BASE_URL }}
        run: ./scripts/build-wasm.sh --release

      - name: Build frontend
        # No VITE_BASE_PATH — Railway serves at the domain root ("/").
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cd www
          bun install
          bun run build

      # GHCR repo paths must be lowercase.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/web" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push static image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web-static.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
