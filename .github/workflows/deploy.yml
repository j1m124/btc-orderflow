name: deploy

# Push to main → build the image → push to GHCR (`:latest` + `:sha-<short>`) →
# (optionally) ping the Dokploy redeploy webhook.
#
# The image is public after the first push (flip the package visibility in
# GitHub → packages → btc-orderflow → Package settings). Dokploy then pulls
# without auth.
#
# Required GHA secrets:
#   DOKPLOY_WEBHOOK_URL  (optional) — if set, the final step POSTs to it to
#                        trigger a redeploy. If unset, the step is a no-op
#                        and you can rely on Dokploy's registry-watch
#                        polling instead.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # cache-from/cache-to use the GHA cache backend. This caches image
      # LAYERS only — BuildKit `RUN --mount=type=cache` mounts do NOT
      # persist across GHA runs (they live in runner-local BuildKit state).
      # The Dockerfile is structured around that fact: cargo-chef cooks all
      # dependencies into a layer keyed on the manifests + lockfile, so
      # app-only commits skip the expensive dependency build entirely.
      # mode=max exports intermediate-stage layers (the cook layer is the
      # point). If the ~10GB GHA cache cap ever starts evicting it, switch
      # to `type=registry,ref=ghcr.io/<repo>:buildcache`.
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_REF=${{ github.ref_name }}

      # Optional: ping the Dokploy redeploy webhook. Skipped if the secret
      # isn't set (lets you wire up Dokploy's polling instead).
      - name: Trigger Dokploy redeploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "POST to Dokploy webhook"
            curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL"
          else
            echo "DOKPLOY_WEBHOOK_URL not set; skipping (Dokploy polling will pick up the new image)"
          fi
